name: Jekyll site CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: Build with Jekyll
      run: bundle exec jekyll build --future
      env:
        JEKYLL_ENV: production
